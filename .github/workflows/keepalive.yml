name: 🐧 LinuxBot — Keepalive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: linuxbot-keepalive
  cancel-in-progress: false

jobs:
  check:
    name: Restart bot if it is down
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔎 ตรวจสถานะบอท
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/actions/workflows/linuxbot.yml/runs"

          ACTIVE=$(gh api "${API}?status=in_progress&per_page=1" --jq '.total_count')
          echo "runs ที่กำลังทำงานอยู่: ${ACTIVE}"

          if [ "${ACTIVE}" -gt 0 ]; then
            echo "should_start=false" >> "$GITHUB_OUTPUT"
            echo "reason=บอทยังออนไลน์อยู่ ไม่ต้องเริ่มใหม่" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(gh api "${API}?per_page=1" --jq '.workflow_runs[0] | [.conclusion, .created_at] | @tsv')
          CONCLUSION=$(printf '%s' "${LATEST}" | cut -f1)
          CREATED=$(printf '%s' "${LATEST}" | cut -f2)
          echo "run ล่าสุดจบด้วย '${CONCLUSION}' เมื่อ ${CREATED}"

          if [ "${CONCLUSION}" = "failure" ]; then
            echo "should_start=false" >> "$GITHUB_OUTPUT"
            echo "reason=run ล่าสุดล้มเหลว — ไม่เริ่มซ้ำอัตโนมัติเพื่อไม่ให้วนไม่จบ ดู log แล้วแก้ก่อน" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date -u +%s)
          THEN=$(date -u -d "${CREATED}" +%s)
          AGE=$(( NOW - THEN ))
          if [ "${AGE}" -lt 1200 ]; then
            echo "should_start=false" >> "$GITHUB_OUTPUT"
            echo "reason=run ล่าสุดเริ่มไปเพียง $(( AGE / 60 )) นาที อาจอยู่ระหว่างเริ่ม" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_start=true" >> "$GITHUB_OUTPUT"
          echo "reason=ไม่มี run ที่กำลังทำงาน และ run ก่อนหน้าจบมานานแล้ว ($(( AGE / 60 )) นาที)" >> "$GITHUB_OUTPUT"

      - name: 🚀 เริ่มบอทใหม่
        if: steps.check.outputs.should_start == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/linuxbot.yml/dispatches" \
            -F ref="$GITHUB_REF_NAME" \
            -F inputs[register_commands]=true
          echo "สั่งเริ่มบอทใหม่แล้วที่ branch ${GITHUB_REF_NAME}"

      - name: 📋 สรุปผล
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### 🐧 LinuxBot Keepalive"
            echo ""
            echo "- เหตุผล: ${{ steps.check.outputs.reason }}"
            echo "- เริ่มใหม่: ${{ steps.check.outputs.should_start == 'true' && 'ใช่' || 'ไม่ใช่' }}"
            echo "- ตรวจเมื่อ: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
