name: 🐧 LinuxBot — Run

on:
  workflow_dispatch:
    inputs:
      register_commands:
        description: Register/update Discord slash commands before starting
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: linuxbot-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Start LinuxBot
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      GUILD_ID: ${{ secrets.GUILD_ID }}
      ADMIN_ROLE_ID: ${{ secrets.ADMIN_ROLE_ID }}
      ACCEPT_EPHEMERAL_STORAGE: "true"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔎 Check required secrets
        shell: bash
        run: |
          missing=0

          for name in DISCORD_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "✅ Required secrets are present"

      - name: 🧩 Register Discord commands
        if: ${{ inputs.register_commands }}
        run: npm run register

      - name: 🏗️ Build LinuxBot
        run: npm run build

      - name: 🐧 Start LinuxBot
        run: |
          echo "========================================"
          echo "🐧 LinuxBot is starting..."
          echo "========================================"
          echo "Keep this workflow running while the bot is online."
          echo "========================================"
          npm start
